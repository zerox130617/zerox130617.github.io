<h2 id="為什麼選擇-github-pages">為什麼選擇 GitHub Pages？</h2>

<p>我選擇使用 GitHub Pages 搭配 Jekyll，是因為它：</p>

<ol>
  <li><strong>完全免費：</strong> 零託管費用。</li>
  <li><strong>版本控制：</strong> 所有的文章和程式碼都在 Git 版本控制下。</li>
  <li><strong>速度快：</strong> 靜態網頁載入速度極佳。</li>
</ol>
